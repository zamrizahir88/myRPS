name: Keep Supabase awake

# A free-tier Supabase project pauses after 7 days with no activity — which is
# exactly what a semester break looks like. One query a week prevents it.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a public table
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Supabase responded $code"
          # 200 or 401 both prove the project is awake; anything else is a problem.
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then exit 1; fi
