name: Keep Supabase awake

# A free-tier Supabase project pauses after 7 days with no activity — which is
# exactly what a semester break looks like. One query a day prevents it.
#
# Daily, not weekly: GitHub starts scheduled runs hours late and sometimes
# skips one, so a weekly ping leaves gaps of more than 7 days.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a query as a signed-out visitor
        run: |
          # is_admin() is something anon may run: it reads the admins table and
          # answers false. Tables are closed to anon (see 03_rls.sql), so
          # asking for one is refused with a 401 and never runs.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/rpc/is_admin" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H 'Content-Type: application/json' -d '{}')
          echo "Supabase responded $code"
          # Only 200 means a query ran. Anything else fails the run, and GitHub
          # emails you about it.
          if [ "$code" != "200" ]; then exit 1; fi

      # GitHub switches scheduled workflows off after 60 days without a commit.
      # Re-enabling it on every run restarts that clock.
      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
