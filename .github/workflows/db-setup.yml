name: Set up Supabase database

# Applies everything in supabase/ to your project, then verifies it.
# You don't need anything installed — it runs on GitHub's machines.
#
# One-time setup: add a repository secret named SUPABASE_DB_URL.
#   Supabase dashboard → Connect → Session pooler → copy the URI,
#   replace [YOUR-PASSWORD] with your database password.
#
# GitHub encrypts that secret. It is never shown in logs, never visible in the
# repository, and nobody — including anyone helping you — can read it back.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        required: true
        default: apply
        type: choice
        options: [apply, check-only]
      adhoc:
        description: 'One-off script from supabase/adhoc/ (e.g. make-admin.sql). Leave blank for none.'
        required: false
        type: string
      email:
        description: 'Email address, if the one-off script needs one.'
        required: false
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Postgres client library
        run: npm install pg@^8 --no-save

      - name: Apply and verify
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          ADHOC: ${{ inputs.adhoc }}
          EMAIL: ${{ inputs.email }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

          if [ "${{ inputs.mode }}" = "check-only" ]; then
            node scripts/setup-db.mjs --check
            exit 0
          fi

          args=""
          if [ -n "$ADHOC" ]; then
            script="supabase/adhoc/${ADHOC##*/}"     # no path traversal
            if [ ! -f "$script" ]; then
              echo "::error::No such script: $script"
              echo "Available:"; ls supabase/adhoc/
              exit 1
            fi
            args="--adhoc $script"
            [ -n "$EMAIL" ] && args="$args --set email=$EMAIL"
          fi

          node scripts/setup-db.mjs $args
